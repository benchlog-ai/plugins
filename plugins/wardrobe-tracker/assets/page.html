<title>Wardrobe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: swatch-book — summary strip, palette bar, then wardrobe swatches by type, outfits log and pairings side by side */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --fg:#1d2124; --muted:#646b70; --line:#dfe2df;
  --accent:#2f4a7a; --accent-soft:#e3e9f3; --good:#2e7d4f; --bad:#b4442f;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141719; --surface:#1d2124; --fg:#e8eaeb; --muted:#9aa2a7; --line:#2e3438;
  --accent:#8fb0e6; --accent-soft:#24314a; --good:#6cc493; --bad:#e58b77; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141719; --surface:#1d2124; --fg:#e8eaeb; --muted:#9aa2a7; --line:#2e3438;
  --accent:#8fb0e6; --accent-soft:#24314a; --good:#6cc493; --bad:#e58b77; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 56px;display:flex;flex-direction:column;gap:28px}
h1,h2{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,4vw,40px)}
h2{font-size:20px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px}
.stats{display:flex;flex-wrap:wrap;gap:24px}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.palette{display:flex;height:44px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.palette div{min-width:3px}
.palette-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.palette-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.chip:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.group{display:flex;flex-direction:column;gap:12px}
.group-head{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.group-head .mono{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.swatch{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
.swatch .fab{height:78px;position:relative}
.swatch .fab .sec{position:absolute;right:0;top:0;bottom:0;width:28%}
.swatch .meta{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.swatch .name{font-weight:600;font-size:14px;line-height:1.3}
.swatch .sub{font-size:12px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:11px;padding:1px 6px;border-radius:3px;background:var(--accent-soft);color:var(--fg)}
.tag.cold{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:28px}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.row{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .when{color:var(--muted)}
.row .what{min-width:0}
.row .what b{font-weight:600}
.row .what div{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.dots{display:flex;gap:3px}
.dots i{width:16px;height:16px;border-radius:50%;border:1px solid var(--line)}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.works{color:var(--good)} .pill.avoid{color:var(--bad)}
.combo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.combo:first-child{border-top:0}
.combo .bar{display:flex;width:72px;height:28px;border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.combo .bar i{flex:1}
.empty{padding:28px 20px;border:1px dashed var(--line);border-radius:4px;color:var(--muted);background:var(--surface)}
.empty b{color:var(--fg)}
.empty code{font-family:var(--mono);font-size:12px;background:var(--accent-soft);padding:1px 5px;border-radius:3px;color:var(--fg)}
.status{font-size:12px;color:var(--muted)}
.sugg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
.scard .fab{height:44px;position:relative}
.scard .rank{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:12px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.scard .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.scard .name{font-weight:600;font-size:14px;line-height:1.3}
.scard .sub{font-size:12px;color:var(--muted)}
.scard .why{font-size:13px;line-height:1.45}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.idea .strip{display:flex;height:44px}
.idea .strip i{flex:1}
.idea .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.idea .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.idea .name{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.idea .when{color:var(--muted);white-space:nowrap}
.idea .pcs{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.idea .why{font-size:13px;line-height:1.45}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Wardrobe book</div>
      <h1>My Wardrobe</h1>
      <div class="status" id="status">Connecting to your wardrobe…</div>
    </div>
    <div class="stats">
      <div class="stat"><b id="s-items">–</b><span>pieces</span></div>
      <div class="stat"><b id="s-acc">–</b><span>accessories</span></div>
      <div class="stat"><b id="s-outfits">–</b><span>outfits logged</span></div>
      <div class="stat"><b id="s-combos">–</b><span>pairings rated</span></div>
    </div>
  </header>

  <section aria-labelledby="pal-h">
    <div class="group-head"><h2 id="pal-h">Color palette</h2><span class="mono">share of pieces, sorted by hue</span></div>
    <div class="palette" id="palette" style="margin-top:12px"></div>
    <div class="palette-legend" id="legend"></div>
  </section>

  <section aria-labelledby="wd-h" class="group">
    <div class="group-head"><h2 id="wd-h">Wardrobe</h2><span class="mono" id="wd-count"></span></div>
    <div class="filters" id="filters" role="group" aria-label="Filter by occasion"></div>
    <div id="wardrobe" class="group" style="gap:24px"></div>
  </section>

  <section aria-labelledby="id-h" class="group">
    <div class="group-head"><h2 id="id-h">Recent outfit ideas</h2><span class="mono" id="id-count">last 5</span></div>
    <div id="ideas"></div>
  </section>

  <section aria-labelledby="sg-h" class="group">
    <div class="group-head"><h2 id="sg-h">Suggestions</h2><span class="mono" id="sg-count">what to buy next</span></div>
    <div id="suggestions"></div>
  </section>

  <div class="cols">
    <section class="panel" aria-labelledby="of-h">
      <div class="group-head"><h2 id="of-h">Recent outfits</h2><span class="mono">last 20</span></div>
      <div id="outfits"></div>
    </section>
    <section class="panel" aria-labelledby="cb-h">
      <div class="group-head"><h2 id="cb-h">Color pairings</h2></div>
      <div id="combos"></div>
    </section>
  </div>
</div>

<script>
const CAT_ORDER=["top","bottom","outerwear","suit","traditional","footwear","accessory"];
const CAT_LABEL={top:"Tops",bottom:"Bottoms",outerwear:"Outerwear",suit:"Suits",traditional:"Traditional wear",footwear:"Footwear",accessory:"Accessories"};
const state={items:[],outfits:[],combos:[],suggestions:[],ideas:[],filter:"all"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const okHex=h=>/^#[0-9a-fA-F]{6}$/.test(h||"")?h:"#999999";
function hue(h){h=okHex(h);const r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,l=(mx+mn)/2;if(d<.08)return 400+l*100; // neutrals last, dark→light
  let H=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;return (H*60+360)%360}

function emptyBox(what){
  const hints={
    items:'Your wardrobe is empty. Tell Claude something like <code>log my navy wool blazer</code> or share a photo of a piece.',
    outfits:'No outfits logged yet. Try <code>I wore the grey suit with a white shirt to the office today</code>.',
    combos:'No pairings rated yet. Try <code>navy and camel works well for me</code>.',
    ideas:'No outfit ideas yet. Ask Claude <code>build me an outfit for the office</code>; the last 5 appear here.',
    suggestions:'No suggestions yet. Ask Claude <code>what should I buy next?</code>'};
  return `<div class="empty">${hints[what]}</div>`;
}

function render(){
  const {items,outfits,combos}=state;
  const acc=items.filter(i=>i.category==="accessory"||i.category==="footwear");
  $("s-items").textContent=items.length-acc.length;$("s-acc").textContent=acc.length;
  $("s-outfits").textContent=outfits.length;$("s-combos").textContent=combos.length;

  // palette
  const byColor={};items.forEach(i=>{const k=(i.color_name||"").toLowerCase()||okHex(i.hex);(byColor[k]??={name:i.color_name||i.hex,hex:okHex(i.hex),n:0}).n++});
  const cols=Object.values(byColor).sort((a,b)=>hue(a.hex)-hue(b.hex));
  $("palette").innerHTML=cols.length?cols.map(c=>`<div style="flex:${c.n};background:${c.hex}" title="${esc(c.name)} · ${c.n}"></div>`).join(""):`<div style="flex:1;background:var(--surface)"></div>`;
  $("legend").innerHTML=cols.map(c=>`<span><i style="background:${c.hex}"></i>${esc(c.name)} <span class="mono">${c.n}</span></span>`).join("");

  // wear counts
  const worn={},last={};outfits.forEach(o=>(o.item_ids||[]).forEach(id=>{worn[id]=(worn[id]||0)+1;if(!last[id]||o.date>last[id])last[id]=o.date}));

  // filters
  const occ=[...new Set(items.flatMap(i=>i.occasions||[]))].sort();
  $("filters").innerHTML=["all",...occ].map(o=>`<button class="chip" data-f="${esc(o)}" aria-pressed="${state.filter===o}">${o==="all"?"All occasions":esc(o)}</button>`).join("");
  const shown=state.filter==="all"?items:items.filter(i=>(i.occasions||[]).includes(state.filter));
  $("wd-count").textContent=shown.length+" shown";
  if(!items.length){$("wardrobe").innerHTML=emptyBox("items")}else{
    const groups={};shown.forEach(i=>(groups[CAT_ORDER.includes(i.category)?i.category:"accessory"]??=[]).push(i));
    $("wardrobe").innerHTML=CAT_ORDER.filter(c=>groups[c]).map(c=>`
      <div class="group"><div class="group-head"><h2 style="font-size:16px">${CAT_LABEL[c]}</h2><span class="mono">${groups[c].length}</span></div>
      <div class="grid">${groups[c].sort((a,b)=>hue(a.hex)-hue(b.hex)).map(i=>{
        const w=worn[i.id]||0;
        return `<article class="swatch"><div class="fab" style="background:${okHex(i.hex)}">${i.secondary_hex?`<div class="sec" style="background:${okHex(i.secondary_hex)}"></div>`:""}</div>
        <div class="meta"><div class="name">${esc(i.name)}</div>
        <div class="sub">${esc([i.color_name,i.fabric,i.pattern&&i.pattern!=="solid"?i.pattern:""].filter(Boolean).join(" · "))}</div>
        <div class="tags">${(i.occasions||[]).map(o=>`<span class="tag">${esc(o)}</span>`).join("")}
        <span class="tag ${w?"":"cold"} mono">${w?`worn ${w}×`:"not worn yet"}</span></div></div></article>`}).join("")}</div></div>`).join("")||`<div class="empty">Nothing tagged for this occasion yet.</div>`;
  }

  // outfits
  const byId=Object.fromEntries(items.map(i=>[i.id,i]));
  const recent=[...outfits].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,20);
  $("outfits").innerHTML=recent.length?`<div class="list">${recent.map(o=>{
    const pieces=(o.item_ids||[]).map(id=>byId[id]).filter(Boolean);
    const hexes=pieces.length?pieces.map(p=>p.hex):(o.colors||[]);
    return `<div class="row"><span class="when mono">${esc(o.date||"")}</span>
      <div class="what"><b>${esc(o.event||"Outfit")}</b>${o.rating?` <span class="mono">· ${"★".repeat(Math.max(0,Math.min(5,o.rating)))}</span>`:""}
      <div>${esc(pieces.map(p=>p.name).join(", ")||o.description||"")}</div></div>
      <div class="dots">${hexes.slice(0,6).map(h=>`<i style="background:${okHex(h)}"></i>`).join("")}</div></div>`}).join("")}</div>`:emptyBox("outfits");

  // outfit ideas (newest 5)
  const ideas=[...state.ideas].sort((a,b)=>(b.created||"").localeCompare(a.created||"")).slice(0,5);
  $("id-count").textContent=ideas.length?"last "+ideas.length+" of 5":"last 5";
  $("ideas").innerHTML=ideas.length?`<div class="ideas">${ideas.map(x=>{
    const ps=(x.item_ids||[]).map(id=>byId[id]).filter(Boolean);
    return `<article class="idea"><div class="strip">${ps.map(p=>`<i style="background:${okHex(p.hex)}" title="${esc(p.name)}"></i>`).join("")||`<i style="background:var(--line)"></i>`}</div>
    <div class="meta"><div class="top"><span class="name">${esc(x.name||x.event||"Outfit idea")}</span><span class="when mono">${esc((x.created||"").slice(0,10))}</span></div>
    <div class="pcs">${esc(ps.map(p=>p.name).join(", "))}</div>
    ${x.why?`<div class="why">${esc(x.why)}</div>`:""}
    <div class="tags">${x.event?`<span class="tag">${esc(x.event)}</span>`:""}${x.wada_no?`<span class="tag mono" title="${esc((x.wada_colors||[]).join(", "))}">Wada No. ${esc(x.wada_no)}</span>`:""}${x.status==="picked"?`<span class="tag mono">picked</span>`:""}</div></div></article>`}).join("")}</div>`:emptyBox("ideas");

  // suggestions
  const sg=[...state.suggestions].filter(x=>x.status!=="bought").sort((a,b)=>(a.priority||99)-(b.priority||99));
  $("sg-count").textContent=sg.length?sg.length+" to buy, ranked":"what to buy next";
  $("suggestions").innerHTML=sg.length?`<div class="sugg">${sg.map(x=>`<article class="scard">
    <div class="fab" style="background:${okHex(x.hex)}"><span class="rank">#${esc(x.priority||"–")}</span></div>
    <div class="meta"><div class="name">${esc(x.name)}</div>
    <div class="sub">${esc([x.color_name,x.fabric,x.subtype].filter(Boolean).join(" · "))}</div>
    <div class="why">${esc(x.reason||"")}</div>
    ${x.unlocks?`<div class="tags"><span class="tag">${esc(x.unlocks)}</span></div>`:""}</div></article>`).join("")}</div>`:emptyBox("suggestions");

  // combos
  const cs=[...combos].sort((a,b)=>(a.verdict==="avoid")-(b.verdict==="avoid")||(b.rating||0)-(a.rating||0));
  $("combos").innerHTML=cs.length?`<div class="list">${cs.map(c=>`<div class="combo">
    <div class="bar">${(c.colors||[]).map(h=>`<i style="background:${okHex(h)}"></i>`).join("")}</div>
    <div class="what" style="min-width:0"><b>${esc((c.names||[]).join(" + "))}</b><div style="font-size:13px;color:var(--muted)">${esc([(c.occasions||[]).join(", "),c.notes].filter(Boolean).join(" — "))}</div></div>
    <span class="pill ${c.verdict==="avoid"?"avoid":"works"}">${c.verdict==="avoid"?"Avoid":"Works"}</span></div>`).join("")}</div>`:emptyBox("combos");
}

document.addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(!b)return;state.filter=b.dataset.f;render()});
render();

(async()=>{
  const db=await window.claude?.use?.("db");
  if(!db){$("status").textContent="Open this page signed in to claude.ai to see your wardrobe.";return}
  $("status").textContent="Live — updates as Claude logs new pieces and outfits.";
  const sub=(name,key)=>db.collection(name).onSnapshot(s=>{state[key]=s.docs.map(d=>({id:d.id,...d.data()}));render()},
    ()=>{$("status").textContent="Lost connection to the wardrobe data. Reload to reconnect."});
  sub("items","items");sub("outfits","outfits");sub("combos","combos");sub("suggestions","suggestions");sub("outfit_ideas","ideas");
})();
</script>
